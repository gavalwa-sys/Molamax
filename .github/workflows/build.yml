name: Build Molamax Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get the project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK components
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Make Gradle executable
      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      # 6. Clean project
      - name: Clean project
        run: ./gradlew clean

      # 7. Build debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 8. Upload APK
      - name: Upload Molamax APK
        uses: actions/upload-artifact@v4
        with:
          name: Molamax-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 9. Show APK information
      - name: Show APK location
        run: |
          echo "========================================"
          echo "Molamax APK successfully built"
          echo "========================================"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
